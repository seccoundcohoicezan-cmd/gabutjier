<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffa751">
<title>Mau 200K?</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #ffe259, #ffa751);
    overflow-x: hidden;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }
  .card {
    background: #fff;
    border-radius: 24px;
    padding: clamp(24px, 6vw, 40px) clamp(16px, 5vw, 30px);
    max-width: 480px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    position: relative;
    min-height: 340px;
  }
  h1 {
    font-size: clamp(1.15rem, 5.2vw, 1.5rem);
    color: #333;
    margin-bottom: 30px;
    line-height: 1.4;
  }
  .btn-area {
    position: relative;
    height: 190px;
    margin: 0 auto;
    width: 100%;
  }
  button {
    padding: 16px 38px;
    min-height: 52px;
    font-size: 1.15rem;
    -webkit-appearance: none;
    appearance: none;
    font-weight: bold;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  #yesBtn {
    position: absolute;
    background: #ff5c5c;
    color: white;
    box-shadow: 0 6px 15px rgba(255,92,92,0.4);
    left: 50%;
    top: 0;
    transform: translateX(-50%);
  }
  #noBtn {
    position: absolute;
    background: #4caf50;
    color: white;
    box-shadow: 0 6px 15px rgba(76,175,80,0.4);
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
  }
  #noBtn:hover {
    transform: translateX(-50%) scale(1.08);
  }
  @media (max-width: 380px) { .card { min-height: 300px; } .btn-area { height: 170px; } }
  .hint {
    margin-top: 12px;
    font-size: 0.85rem;
    color: #999;
    font-style: italic;
  }
  .result {
    display: none;
    animation: pop 0.5s ease;
  }
  .result.show {
    display: block;
  }
  @keyframes pop {
    0% { transform: scale(0.5); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .result img {
    width: 200px;
    max-width: 60%;
    height: auto;
    margin: 10px auto 20px;
    display: block;
    filter: drop-shadow(0 10px 20px rgba(0,0,0,0.25));
  }
  .result h2 {
    color: #ff8c00;
    font-size: 1.5rem;
    margin-bottom: 10px;
  }
  .result p {
    color: #555;
    font-size: 1rem;
    line-height: 1.5;
  }
  .confetti {
    position: fixed;
    top: -10px;
    font-size: 1.5rem;
    animation: fall linear forwards;
    pointer-events: none;
    z-index: 999;
  }
  @keyframes fall {
    to {
      transform: translateY(110vh) rotate(360deg);
      opacity: 0.3;
    }
  }
</style>
</head>
<body>

<div class="card">
  <div id="questionSection">
    <h1>Simpel aja... 🤔<br>Kamu mau gak aku kasih uang <b>200K</b>? 💸</h1>
    <div class="btn-area">
      <button id="yesBtn">Mau</button>
      <button id="noBtn">Tidak</button>
    </div>
    <div class="hint">pikir baik-baik ya 😏</div>
  </div>

<script>
const yesBtn = document.getElementById('yesBtn');
const noBtn = document.getElementById('noBtn');
const btnArea = document.querySelector('.btn-area');
const questionSection = document.getElementById('questionSection');
const resultSection = document.getElementById('resultSection');

function dodge() {
  const areaW = btnArea.clientWidth;
  const areaH = btnArea.clientHeight;
  const btnW = yesBtn.offsetWidth;
  const btnH = yesBtn.offsetHeight;
  const maxX = Math.max(0, areaW - btnW);
  const maxY = Math.max(0, areaH - btnH);
  const nb = { l: noBtn.offsetLeft - noBtn.offsetWidth / 2, t: noBtn.offsetTop, w: noBtn.offsetWidth, h: noBtn.offsetHeight };
  const pad = 14;
  let x = 0, y = 0;
  for (let i = 0; i < 30; i++) {
    x = Math.random() * maxX;
    y = Math.random() * maxY;
    const overlap = x < nb.l + nb.w + pad && x + btnW > nb.l - pad &&
                    y < nb.t + nb.h + pad && y + btnH > nb.t - pad;
    if (!overlap) break;
  }
  yesBtn.style.left = x + 'px';
  yesBtn.style.top = y + 'px';
  yesBtn.style.transform = 'none';
}

// dodge on hover/touch approach, before click can register
yesBtn.addEventListener('mouseenter', dodge);
yesBtn.addEventListener('pointerdown', function(e){ e.preventDefault(); dodge(); });
yesBtn.addEventListener('touchstart', function(e){ e.preventDefault(); dodge(); }, {passive:false});
yesBtn.addEventListener('click', function(e){
  e.preventDefault();
  dodge();
});

function launchConfetti() {
  const emojis = ['🙏','😢','💛','😔','💸'];
  for (let i = 0; i < 30; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    c.style.left = Math.random() * 100 + 'vw';
    c.style.animationDuration = (2 + Math.random()*2) + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4000);
  }
}

noBtn.addEventListener('click', function() {
  questionSection.style.display = 'none';
  resultSection.classList.add('show');
  launchConfetti();
});
</script>
